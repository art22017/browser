name: Argon Windows
on:
  workflow_dispatch:
  push:
    branches: [argon/isolated-workspaces-ui]
  pull_request:
    paths:
      [
        "host/**",
        "src/**",
        "scripts/argon*",
        "prefs/**",
        "configs/**",
        ".github/workflows/argon-windows.yml",
        "surfer.json",
      ]
permissions:
  contents: read
concurrency:
  group: argon-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts
      - run: npm run test:argon
      - run: dotnet run --project host/Argon.Host.Tests/Argon.Host.Tests.csproj
      - run: dotnet build host/Argon.Host/Argon.Host.csproj -c Release --nologo
      - run: dotnet run --project host/Argon.Native.Tests/Argon.Native.Tests.csproj
  gecko:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner storage
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf2.13 automake bison build-essential cabextract clang cmake curl flex gawk gcc-multilib jq libasound2-dev libbz2-dev libcurl4-openssl-dev libdbus-glib-1-dev libdrm-dev libexpat1-dev libffi-dev libgtk-3-dev libpulse-dev libsqlite3-dev libssl-dev libtool libucl-dev libxml2-dev libx11-xcb-dev libxt-dev lld llvm m4 msitools nasm ninja-build p7zip-full pkg-config python3-dev python3-pip python3-requests python3-toml unzip uuid-dev xvfb yasm zip zstd zlib1g-dev
          npm ci
      - name: Build Argon Gecko for Windows
        run: bash scripts/argon-windows-engine.sh
      - uses: actions/upload-artifact@v4
        with:
          name: argon-gecko-windows-x64
          path: dist/argon-gecko-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
  package:
    needs: gecko
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: argon-gecko-windows-x64
          path: dist
      - name: Assemble Windows distribution
        shell: pwsh
        run: |
          dotnet publish host/Argon.Host/Argon.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o host/staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath dist/argon-gecko-windows-x64.zip -DestinationPath host/gecko-package
          $engineExe = Get-ChildItem -LiteralPath host/gecko-package -Filter argon-engine.exe -Recurse | Select-Object -First 1
          if (!$engineExe) { throw 'Gecko archive does not contain argon-engine.exe' }
          Copy-Item -LiteralPath $engineExe.Directory.FullName -Destination host/staging/engine -Recurse
          if (!(Test-Path host/staging/engine/argon-engine.exe)) { throw 'Engine layout is invalid' }
          Compress-Archive -Path host/staging/* -DestinationPath dist/Argon-0.1.0-alpha-windows-x64.zip
      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' host/installer/argon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/Argon-* | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Argon-Windows-x64
          path: |
            dist/Argon-*.zip
            dist/Argon-*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
